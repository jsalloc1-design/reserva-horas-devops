<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b6e78"/>
    </marker>
  </defs>
  <rect width="1000" height="340" rx="14" fill="#f4f8fa"/>

  <!-- Navegador -->
  <rect x="30" y="110" width="200" height="120" rx="12" fill="#ffffff" stroke="#c4d0dc" stroke-width="2"/>
  <rect x="30" y="110" width="200" height="28" rx="12" fill="#e3ebf1"/>
  <circle cx="48" cy="124" r="5" fill="#e06c6c"/><circle cx="64" cy="124" r="5" fill="#e0b84c"/><circle cx="80" cy="124" r="5" fill="#5cb85c"/>
  <text x="130" y="178" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">Navegador</text>
  <text x="130" y="204" text-anchor="middle" font-size="15" fill="#0b6e78">localhost:8080</text>

  <line x1="235" y1="170" x2="345" y2="170" stroke="#0b6e78" stroke-width="3" marker-end="url(#flecha)"/>
  <text x="290" y="158" text-anchor="middle" font-size="13" fill="#5b6b7b">HTTP :8080</text>

  <!-- Docker Desktop -->
  <rect x="350" y="30" width="620" height="280" rx="16" fill="#e8f4fd" stroke="#2496ed" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="370" y="60" font-size="18" font-weight="700" fill="#1d63a8">Docker Desktop · docker compose</text>

  <!-- Contenedor -->
  <rect x="380" y="80" width="360" height="200" rx="14" fill="#ffffff" stroke="#0b6e78" stroke-width="2"/>
  <text x="400" y="110" font-size="17" font-weight="700" fill="#0b6e78">Contenedor: reserva-horas-web</text>
  <text x="400" y="132" font-size="13" fill="#5b6b7b">Imagen reserva-horas-web:1.0.0 (base nginx:alpine)</text>

  <rect x="400" y="150" width="140" height="110" rx="10" fill="#e6f6ec" stroke="#22a35a" stroke-width="1.5"/>
  <text x="470" y="192" text-anchor="middle" font-size="18" font-weight="700" fill="#1a7a43">Nginx</text>
  <text x="470" y="216" text-anchor="middle" font-size="13" fill="#3c5a48">puerto 80</text>

  <line x1="545" y1="205" x2="580" y2="205" stroke="#0b6e78" stroke-width="2" marker-end="url(#flecha)"/>

  <rect x="585" y="150" width="140" height="110" rx="10" fill="#fff6e0" stroke="#e0a800" stroke-width="1.5"/>
  <text x="655" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#8a5a00">/usr/share/</text>
  <text x="655" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#8a5a00">nginx/html</text>
  <text x="655" y="224" text-anchor="middle" font-size="13" fill="#8a5a00">index.html</text>
  <text x="655" y="242" text-anchor="middle" font-size="13" fill="#8a5a00">styles.css</text>

  <!-- Archivos de configuración -->
  <rect x="770" y="80" width="180" height="200" rx="14" fill="#ffffff" stroke="#c4d0dc" stroke-width="2"/>
  <text x="860" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2d3d">Infraestructura</text>
  <text x="860" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2d3d">como Código</text>
  <text x="860" y="165" text-anchor="middle" font-size="14" fill="#1d63a8">Dockerfile</text>
  <text x="860" y="192" text-anchor="middle" font-size="14" fill="#1d63a8">docker-compose.yml</text>
  <text x="860" y="219" text-anchor="middle" font-size="14" fill="#1d63a8">.env.example</text>
  <text x="860" y="246" text-anchor="middle" font-size="14" fill="#1d63a8">.gitignore</text>
  <line x1="768" y1="180" x2="745" y2="180" stroke="#0b6e78" stroke-width="2" marker-end="url(#flecha)"/>
</svg>
