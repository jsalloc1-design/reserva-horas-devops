<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b6e78"/>
      <stop offset="1" stop-color="#0a4f5c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <!-- decoración -->
  <circle cx="1080" cy="40" r="120" fill="#ffffff" opacity="0.05"/>
  <circle cx="1150" cy="270" r="90" fill="#ffffff" opacity="0.05"/>

  <!-- cruz médica -->
  <g transform="translate(70,85)">
    <rect width="130" height="130" rx="28" fill="#ffffff" opacity="0.12"/>
    <rect x="50" y="22" width="30" height="86" rx="6" fill="#ffffff"/>
    <rect x="22" y="50" width="86" height="30" rx="6" fill="#ffffff"/>
  </g>

  <text x="240" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Reserva de Horas Médicas</text>
  <text x="240" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cdeef0">Proyecto DevOps · Centro de Salud Vida Plena</text>

  <!-- etiquetas de tecnologías -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="240" y="200" width="98" height="34" rx="17" fill="#ffffff" opacity="0.15"/>
    <text x="289" y="223" text-anchor="middle" fill="#ffffff">Docker</text>
    <rect x="350" y="200" width="88" height="34" rx="17" fill="#ffffff" opacity="0.15"/>
    <text x="394" y="223" text-anchor="middle" fill="#ffffff">Nginx</text>
    <rect x="450" y="200" width="70" height="34" rx="17" fill="#ffffff" opacity="0.15"/>
    <text x="485" y="223" text-anchor="middle" fill="#ffffff">Git</text>
    <rect x="532" y="200" width="160" height="34" rx="17" fill="#ffffff" opacity="0.15"/>
    <text x="612" y="223" text-anchor="middle" fill="#ffffff">GitHub Actions</text>
    <rect x="704" y="200" width="150" height="34" rx="17" fill="#22a35a"/>
    <text x="779" y="223" text-anchor="middle" fill="#ffffff">localhost:8080</text>
  </g>
</svg>
